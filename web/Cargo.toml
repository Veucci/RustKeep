[package]
name = "web"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
icons = { version = "0.19.0", features = ["leptos"] }
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
leptos_ui = "0.3.22"
tw_merge = { version = "0.1.22", features = ["variant"] }
strum = { version = "0.27", features = ["derive"] }
time = { version = "0.3", features = ["formatting", "local-offset", "macros", "parsing", "wasm-bindgen"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "AbortController", "AbortSignal", "console", "Clipboard", "ClipboardEvent", "DocumentFragment", "HtmlDocument", "HtmlTemplateElement", "Node", "Range", "Selection", "CssStyleDeclaration", "DataTransfer", "DomTokenList", "DragEvent", "Element",
  "File", "FileList", "FormData", "HtmlInputElement", "HtmlTextAreaElement", "Location", "MediaQueryList",
  "Navigator", "NodeList", "Storage",
] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[package.metadata.leptos]
tailwind-input-file = "style/tailwind.css"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
