[package]
name = "rustkeep"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt", "macros", "net", "fs", "time", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
libsql = { version = "0.9", default-features = false, features = ["core", "remote", "tls", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
argon2 = "0.5"
chacha20poly1305 = "0.10"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
hex = "0.4"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rust_xlsxwriter = { version = "0.99", default-features = false }
genpdf = { version = "0.2", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff", "tga", "qoi"] }
resvg = { version = "0.48.1", default-features = false, features = ["text"] }
lopdf = { version = "0.45", default-features = false }
calamine = { version = "0.36.1", default-features = false }
csv = "1.4.0"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "flac", "vorbis", "ogg", "wav", "pcm", "aac", "isomp4", "adpcm"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
